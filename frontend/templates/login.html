<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>

<body class="bg-light">
  <div class="container py-5" style="max-width:520px;">
    <div class="text-center mb-4">
      <img alt="WFMS Logo" style="height:56px" src="{{ url_for('static', filename='images/Nokia-Logo.png') }}" />
      <h1 class="h4 mt-3">Login</h1>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="mb-3">
      {% for category, message in messages %}
      <div class="alert alert-{{ 'danger' if category == 'error' else category }} mb-2">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <div class="card">
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" type="email" name="email" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required />
          </div>
          <div class="d-grid gap-2">
            <button class="btn btn-primary" type="submit">Login</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('signup') }}">Create account</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>

</html>
