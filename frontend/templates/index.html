<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workforce Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>

<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center gap-3">
        <img alt="WFMS Logo" style="height:48px" src="{{ url_for('static', filename='images/Nokia-Logo.png') }}" />
        <h1 class="h3 mb-0">Workforce Management System</h1>
      </div>
      <a class="btn btn-outline-danger" href="{{ url_for('logout') }}">Logout</a>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-12 col-md-4">
        <a class="card text-decoration-none" href="/employees">
          <div class="card-body">
            <h2 class="h5">Manage Employees</h2>
            <p class="text-muted mb-0">Add, view, and remove employees.</p>
          </div>
        </a>
      </div>
      <div class="col-12 col-md-4">
        <a class="card text-decoration-none" href="/shifts">
          <div class="card-body">
            <h2 class="h5">Shift Scheduling</h2>
            <p class="text-muted mb-0">Assign and manage shifts.</p>
          </div>
        </a>
      </div>
      <div class="col-12 col-md-4">
        <a class="card text-decoration-none" href="/attendance">
          <div class="card-body">
            <h2 class="h5">Attendance Tracking</h2>
            <p class="text-muted mb-0">Record attendance for employees.</p>
          </div>
        </a>
      </div>
      <div class="col-12 col-md-4">
        <a class="card text-decoration-none" href="/tasks">
          <div class="card-body">
            <h2 class="h5">Task Assignment</h2>
            <p class="text-muted mb-0">Create tasks and track status.</p>
          </div>
        </a>
      </div>
      <div class="col-12 col-md-4">
        <a class="card text-decoration-none" href="/performance">
          <div class="card-body">
            <h2 class="h5">Performance Overview</h2>
            <p class="text-muted mb-0">View overall WMS statistics.</p>
          </div>
        </a>
      </div>
    </div>

    <div class="card">
      <img class="img-fluid" alt="Workforce Management" src="{{ url_for('static', filename='images/home.png') }}" />
    </div>
  </div>
</body>

</html>
