<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Performance Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>

<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Performance Metrics Dashboard</h1>
      <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Back</a>
    </div>

    <div class="row g-3">
      <div class="col-12 col-md-4">
        <div class="card">
          <div class="card-body">
            <div class="text-muted">Employees</div>
            <div class="display-6">{{ no_of_employees }}</div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card">
          <div class="card-body">
            <div class="text-muted">Tasks</div>
            <div class="display-6">{{ no_of_tasks }}</div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card">
          <div class="card-body">
            <div class="text-muted">Shifts</div>
            <div class="display-6">{{ no_of_shifts }}</div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="card">
          <div class="card-body">
            <div class="text-muted">Attendance Present</div>
            <div class="display-6">{{ no_of_present }}</div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="card">
          <div class="card-body">
            <div class="text-muted">Attendance Absent</div>
            <div class="display-6">{{ no_of_absent }}</div>
          </div>
        </div>
      </div>
    </div>

    <p class="text-muted mt-3 mb-0">Updated as of today</p>
  </div>
</body>

</html>
